# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Xorgxx\NeoxQrCodeBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Enum/'
            - '../src/Model/'
            - '../src/NeoxQrCodeBundle.php'

    Xorgxx\NeoxQrCodeBundle\Security\SingleUseTokenStoreInterface:
        class: Xorgxx\NeoxQrCodeBundle\Security\CacheSingleUseTokenStore
        arguments:
            $cache: '@cache.app'

    Xorgxx\NeoxQrCodeBundle\Decoder\QrDecoderInterface:
        class: Xorgxx\NeoxQrCodeBundle\Decoder\NullQrDecoder

    Xorgxx\NeoxQrCodeBundle\Security\SecureQrPayloadService:
        arguments:
            $secret: '%env(NEOX_QRCODE_SECRET)%'

    Xorgxx\NeoxQrCodeBundle\Service\UserPresetStore:
        arguments:
            $storageDir: '%kernel.project_dir%/var/neox_qrcode'

    # The limiter only exists when symfony/rate-limiter is installed AND the
    # app configured `framework.rate_limiter.xorgxx_neox_qrcode_api` (e.g. by
    # importing config/rate_limiter.yaml). `@?` keeps the argument null
    # otherwise so the API stays usable without limiting.
    Xorgxx\NeoxQrCodeBundle\Controller\QrCodeApiController:
        arguments:
            $apiRateLimiter: '@?limiter.xorgxx_neox_qrcode_api'
